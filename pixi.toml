[workspace]
name = "kelyphos"
version = "0.1.0"
description = "A SwiftUI shell framework for macOS and iPadOS apps"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64"]

[dependencies]
go-gum = ">=0.14"

# Shared app identity — consumed by the local Scripts/swiftui_*.sh helpers.
[activation.env]
APP         = "KelyphosDemo"
PROJECT     = "Kelyphos"
SCHEME      = "KelyphosDemo"
BINARY      = "KelyphosDemo"
WATCH_PATHS = "Sources Tests Kelyphos.icon project.yml"
EXTRA_BUILD_ARGS = "-skipPackagePluginValidation"

[tasks]
# -- Xcode project generation --

generate = "swift run xcodegen generate --spec project.yml"

# Regenerate when the Xcode spec or source tree changed since the last generation.
generate-if-needed = "bash -c 'PROJECT=Kelyphos.xcodeproj/project.pbxproj; if [ ! -f \"$PROJECT\" ] || [ -n \"$(find project.yml Sources Tests Kelyphos.icon -newer \"$PROJECT\" -print -quit 2>/dev/null)\" ]; then swift run xcodegen generate --spec project.yml; else echo \"Xcode project up to date.\"; fi'"

# -- Build --

build                   = { cmd = "bash Scripts/swiftui_build.sh",           depends-on = ["generate-if-needed"] }
build-if-needed         = { cmd = "bash Scripts/swiftui_build_if_needed.sh", depends-on = ["generate-if-needed"] }
build-release           = { cmd = "bash Scripts/swiftui_build.sh",           depends-on = ["generate-if-needed"], env = { CONFIG = "Release" } }
build-release-if-needed = { cmd = "bash Scripts/swiftui_build_if_needed.sh", depends-on = ["generate-if-needed"], env = { CONFIG = "Release" } }

# -- Test --

test = { cmd = "bash Scripts/swiftui_test.sh", depends-on = ["generate-if-needed"] }

# -- Run --

run         = { cmd = "bash Scripts/swiftui_run.sh", depends-on = ["build-if-needed"] }
run-release = { cmd = "bash Scripts/swiftui_run.sh", depends-on = ["build-release-if-needed"], env = { CONFIG = "Release" } }

# -- Release pipeline --

package  = { cmd = "bash Scripts/swiftui_package.sh",  depends-on = ["build-release"] }
sign     = { cmd = "bash Scripts/swiftui_sign.sh",     depends-on = ["package"] }
dmg      = { cmd = "bash Scripts/swiftui_dmg.sh",      depends-on = ["sign"] }
notarize = { cmd = "bash Scripts/swiftui_notarize.sh", depends-on = ["dmg"] }
release  = { cmd = "echo 'Release pipeline complete.'", depends-on = ["notarize"] }

# -- Changelog & cleanup --

changelog = "bash Scripts/swiftui_changelog.sh"
distclean = "rm -rf .build Kelyphos.xcodeproj DerivedData build KelyphosDemo.app KelyphosDemo-*.dmg && xcodebuild -alltargets clean 2>/dev/null; echo 'distclean complete'"
